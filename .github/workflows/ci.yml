name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel previous runs of the same branch if a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Type-check (TypeScript)
        run: npm run lint

      - name: Run backend tests
        run: npm test
        working-directory: backend
        env:
          # Safe defaults for CI – the test setup (backend/tests/setup.ts)
          # overrides these anyway; they guard the app config at import time.
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-at-least-32-characters-long

      - name: Build frontend + backend
        run: npm run build
