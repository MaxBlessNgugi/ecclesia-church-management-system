name: Ecclesia CMS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ecclesia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      - name: Generate Prisma Client
        run: npm run db:generate --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ecclesia_test

      - name: Run Prisma Database Migrations
        run: npm run db:migrate:deploy --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ecclesia_test

      - name: Typecheck Frontend
        run: npm run lint

      - name: Run Backend Vitest Test Suite
        run: npm test --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ecclesia_test
          JWT_SECRET: ecclesia-ci-secret-key-1234567890

      - name: Build Application
        run: npm run build
