name: Ecclesia CMS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Unit + Integration Tests ────────────────────────────────────────────────
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ecclesia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm ci --prefix backend
        # Cache backend node_modules separately from the root cache.
        # The cache key is derived from backend/package-lock.json so it
        # is only invalidated when backend dependencies actually change.

      - name: Generate Prisma Client
        run: npm run db:generate --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ecclesia_test

      - name: Run Prisma Database Migrations
        run: npm run db:migrate:deploy --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ecclesia_test

      - name: Typecheck Frontend
        run: npm run lint

      - name: Run Backend Vitest Test Suite
        run: npm test --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ecclesia_test
          # CI-only secret — never used in production deployments.
          JWT_SECRET: ecclesia-ci-secret-key-1234567890

      - name: Build Application
        run: npm run build

  # ── E2E Smoke Tests (Playwright) ────────────────────────────────────────────
  e2e-smoke:
    runs-on: ubuntu-latest
    # Only run E2E after the build succeeds (needs the built frontend dist).
    needs: test-and-build

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ecclesia_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Generate Prisma Client & Migrate
        run: |
          npm run db:generate --prefix backend
          npm run db:migrate:deploy --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ecclesia_e2e

      - name: Build Frontend
        run: npm run build

      - name: Run E2E Smoke Tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ecclesia_e2e
          JWT_SECRET: ecclesia-ci-secret-key-1234567890

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
