name: Weekly Full Test Suite

# Run every Sunday at 03:00 UTC against a fresh database.
# Catches slow regressions, migration drift, and data-seed issues
# that a single CI run might miss.
on:
  schedule:
    - cron: "0 3 * * 0"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

concurrency:
  group: weekly-full-test
  cancel-in-progress: true

jobs:
  full-test:
    name: Weekly Full Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecclesia_weekly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecclesia_weekly
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      JWT_EXPIRES_IN: 1h
      BACKUP_DISABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Cache Prisma client
        uses: actions/cache@v6
        with:
          path: backend/node_modules/.prisma/client
          key: prisma-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      # Apply migrations to the fresh database, then seed
      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Seed database
        run: npm run db:seed
        working-directory: backend

      - name: Type-check frontend
        run: npm run lint

      - name: Type-check backend
        run: npx tsc --noEmit
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend

      - name: Build frontend + backend
        run: npm run build

      - name: Smoke test — start server and hit health endpoint
        run: |
          PORT=5050 node backend/dist/index.js &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl -sf http://localhost:5050/api/health > /dev/null 2>&1; then
              echo "✅ Server is healthy"
              curl -s http://localhost:5050/api/health
              kill $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            sleep 0.5
          done

          echo "❌ Server did not start within 15 seconds"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
