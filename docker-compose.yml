# ============================================
# Ecclesia Church Management System - Docker Compose
# Orchestrates backend and database services
# ============================================

version: '3.8'

services:
  # ========================================
  # Backend Service (Express Server)
  # ========================================
  backend:
    # Build the backend service from the Dockerfile in the backend directory
    build:
      context: ./backend
      dockerfile: Dockerfile

    # Container name for easy identification
    container_name: ecclesia-backend

    # Restart policy: always restart if the container stops
    restart: always

    # Port mapping: map host port 5000 to container port 5000
    ports:
      - "5000:5000"

    # Environment variables for the backend service
    environment:
      # SQLite database connection string
      # Uses a file-based database stored in the /data volume
      - DATABASE_URL=file:/app/data/ecclesia.db

      # JWT secret for authentication token generation
      # IMPORTANT: Change this to a secure random string in production!
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production

      # Node environment: production disables debug features and enables optimizations
      - NODE_ENV=production

      # Server port (must match the exposed port)
      - PORT=5000

    # Volume for SQLite database persistence
    # Maps a named volume to /app/data inside the container
    # This ensures data persists even if the container is recreated
    volumes:
      - sqlite-data:/app/data

    # Health check configuration
    # Verifies the backend service is running and responsive
    healthcheck:
      # Command to check if the service is healthy
      # Uses wget to make an HTTP request to the health endpoint
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      
      # How often to run the health check (every 30 seconds)
      interval: 30s
      
      # Maximum time to wait for a response (10 seconds)
      timeout: 10s
      
      # Number of failed attempts before marking as unhealthy
      retries: 3
      
      # Time to wait before starting health checks (5 seconds for startup)
      start_period: 5s

    # Network configuration
    # Connect to the default network
    networks:
      - default

    # Resource limits (optional but recommended for production)
    deploy:
      resources:
        limits:
          # Maximum memory usage (256MB)
          memory: 256M
          # Maximum CPU usage (0.5 CPU)
          cpus: '0.5'

# ========================================
# Named Volumes
# ========================================
volumes:
  # SQLite database storage
  # Named volume for persisting database files
  # Data will persist across container restarts and rebuilds
  sqlite-data:
    driver: local

# ========================================
# Networks
# ========================================
networks:
  # Default network for all services
  # Services can communicate using service names as hostnames
  default:
    driver: bridge
