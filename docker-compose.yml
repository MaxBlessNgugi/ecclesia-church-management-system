# =============================================================================
# Ecclesia CMS — Docker Compose (Level 2)
# =============================================================================
# Usage:
#   1. Copy .env.example to .env and set secrets
#   2. docker compose up -d --build
#   3. Open http://localhost:5000
#
# Services:
#   db  — PostgreSQL 16 (data persists in named volume)
#   app — Ecclesia backend + frontend (single Express process on port 5000)
# =============================================================================

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecclesia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ecclesia}
    volumes:
      - ecclesia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecclesia} -d ${POSTGRES_DB:-ecclesia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # DB port NOT published to host for security.
    # App reaches DB via internal Docker network (service name "db").
    # To connect from host for debugging: docker compose exec db psql -U ecclesia

  # ── Ecclesia Application ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ecclesia}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ecclesia}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-maxblessngugi@ecclesia.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Max Bless Ngugi}
      BACKUP_DISABLED: "true"
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      # Mount a host directory for backups (optional)
      - ${BACKUP_DIR:-./backups}:/app/backups

volumes:
  ecclesia-pgdata:
    driver: local
