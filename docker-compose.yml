# =============================================================================
# Ecclesia CMS — Docker Compose (Level 2)
# =============================================================================
# Full-stack deployment: PostgreSQL + Ecclesia app in two containers.
#
# Quick start:
#   1. cp .env.example.docker .env
#   2. Edit .env → set POSTGRES_PASSWORD + JWT_SECRET
#   3. docker compose up -d --build
#   4. docker compose logs app | grep "SEED ACCOUNTS" → get admin password
#   5. Open http://localhost:5000
# =============================================================================

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecclesia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ecclesia}
    volumes:
      - ecclesia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecclesia} -d ${POSTGRES_DB:-ecclesia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Port 5432 is NOT published to the host.
    # The app reaches PostgreSQL via Docker's internal DNS (hostname: "db").
    # To connect from the host for debugging:
    #   docker compose exec db psql -U ecclesia

  # ── Ecclesia App ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ecclesia}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-ecclesia}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-maxblessngugi@ecclesia.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Max Bless Ngugi}
      # Backups disabled by default inside Docker.
      # To backup: docker compose exec db pg_dump -U ecclesia ecclesia > backup.sql
      BACKUP_DISABLED: "true"
      # Entrypoint needs these to locate PostgreSQL
      DB_HOST: db
      DB_PORT: "5432"
    # To mount a backup directory, add:
    #   volumes:
    #     - ./backups:/app/backups
    # Ensure the host directory exists and is writable by the container user.

volumes:
  ecclesia-pgdata:
    driver: local
