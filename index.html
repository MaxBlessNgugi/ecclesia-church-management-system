<!doctype html>
<!--
  =============================================================================
  Ecclesia ChMS — Vite entry HTML.
  Minimal shell: the React tree mounts into #root via /src/main.tsx. Global
  body styling (serif font, neutral palette) is set here so the app paints
  correctly even before CSS/JS loads.
  =============================================================================
-->
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1c1c" />
    <meta name="description" content="Ecclesia Church Management System — Parish management for members, sacraments, finances, and administration" />
    <!-- Content Security Policy: self-hosted fonts/scripts, no remote origins.
         Silences Electron's dev-mode CSP warning; blocks XSS via inline/eval.
         'unsafe-inline' script-src is required by Vite's dev react-refresh
         preamble; ws/http localhost entries serve dev HMR + the dev backend. -->
    <!-- frame-ancestors is delivered via the HTTP header (vite dev + helmet in
         prod) — it is ignored inside a <meta> element and only adds console noise. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:* http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ecclesia" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>ECCLESIA ChMS</title>
  </head>
  <body class="bg-[#f9f9f9] text-[#1a1c1c] font-serif antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
