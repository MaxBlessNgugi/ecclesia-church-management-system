<!doctype html>
<!--
  =============================================================================
  Ecclesia ChMS — Vite entry HTML.
  Minimal shell: the React tree mounts into #root via /src/main.tsx. Global
  body styling (serif font, neutral palette) is set here so the app paints
  correctly even before CSS/JS loads.
  =============================================================================
-->
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="description" content="Ecclesia Church Management System — Parish management for members, sacraments, finances, and administration" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ecclesia" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>ECCLESIA ChMS</title>
  </head>
  <body class="bg-[#f9f9f9] text-[#1a1c1c] font-serif antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
